name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: habit-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release migrations
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          RELEASE_DIR="/opt/habit-api/releases/$GITHUB_SHA"
          STAGING_DIR="/opt/habit-api/releades/.staging-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          SSH_OPTS=(
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=true
            -o StrictHostKeyChecking=yes
          )

          ssh "${SSH_OPTS[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "test ! -e '$RELEASE_DIR' && \
             test ! -e '$STAGING_DIR' && \
             mkdir -m 700 -p '$STAGING_DIR/migrations/'"

          scp "${SSH_OPTS[@]}" \
            migrations/*sql \
            "$VPS_USER@$VPS_HOST:$STAGING_DIR/migrations/"

          ssh "${SSH_OPTS[@]}" \
            "$VPS_USER@$VPS_HOST" \
            "if [ -d '$RELEASE_DIR' ]; then
              git diff -qr '$STAGING_DIR/migrations' '$RELEASE_DIR/migrations' &&
              rm -r -- '$STAGING_DIR'
            else
              mv -T '$STAGING_DIR' '$RELEASE_DIR'
            fi"

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
          -o IdentitiesOnly=yes \
          -o StrictHostChecking=yes \
          "$VPS_USER@$VPS_HOST" \
          "/opt/habit-api/deploy.sh $GITHUB_SHA"

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: habit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d habit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/habit_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golang-migrate
        run: |
          go install -tags 'postgres' \
          github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

      - name: Run database migrations
        run: |
          migrate \
            -path migrations \
            -database "$TEST_DATABASE_URL" \
            up

      - name: Create test tables
        run: |
          PGPASSWORD=test psql \
            -h localhost \
            -p 5432 \
            -U test \
            -d habit_test \
            -v ON_ERROR_STOP=1 \
            -f tests/fixtures/doctors.sql

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build ./...

      - name: Build Docker image
        run: docker build -t habit-api:ci .

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/sskurzhanskiy/habit-api
        run: |
          docker tag habit-api:ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"
