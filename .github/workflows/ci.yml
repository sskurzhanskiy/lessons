name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: habit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d habit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/habit_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golang-migrate
        run: |
          go install -tags 'postgres' \
          github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

      - name: Run database migrations
        run: |
          migrate \
            -path migrations \
            -database "$TEST_DATABASE_URL" \
            up

      - name: Create test tables
        run: |
          PGPASSWORD=test psql \
            -h localhost \
            -p 5432 \
            -U test \
            -d habit_test \
            -v ON_ERROR_STOP=1 \
            -f tests/fixtures/doctors.sql

      - name: Run tests
        run: go test ./...

      - name: Build application
        run: go build ./...

      - name: Build Docker image
        run: docker build -t habit-api:ci .
