services:
    migrate:
      profiles:
        - tools
      image: migrate/migrate:4
      volumes:
        - ./migrations:/migrations:ro
      command:
        - "-path=/migrations"
        - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB_NAME}?sslmode=disable"
        - "up"
      depends_on:
        db:
          condition: service_healthy
      restart: "no"

    nginx:
      image: nginx:stable-alpine
      ports:
        - "127.0.0.1:8080:80"
      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
        - api1
        - api2
        - api3
    
    api1:
      build: .
      environment:
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB_NAME}?sslmode=disable
        JWT_SECRET: ${JWT_SECRET}
        HABBIT_CONFIG_NAME: dev  
      depends_on:
        db:
          condition: service_healthy

    api2:
      build: .
      environment:
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB_NAME}?sslmode=disable
        JWT_SECRET: ${JWT_SECRET}
        HABBIT_CONFIG_NAME: dev  
      depends_on:
        db:
          condition: service_healthy

    api3:
      build: .
      environment:
        DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB_NAME}?sslmode=disable
        JWT_SECRET: ${JWT_SECRET}
        HABBIT_CONFIG_NAME: dev  
      depends_on:
        db:
          condition: service_healthy
    
    db:
      image: postgres:17
      volumes:
        - postgres_data:/var/lib/postgresql/data
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB_NAME}
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}"]
        interval: 5s
        timeout: 3s
        retries: 5

volumes:
    postgres_data:
